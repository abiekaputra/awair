[project]
name = "awair"
version = "0.1.0"
description = "Reproducible two-stage air quality prediction service"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Abi Eka Putra Wulyono" }]
dependencies = [
    "fastapi>=0.115,<1.0",
    "joblib>=1.4,<2.0",
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<3.0",
    "prometheus-client>=0.21,<1.0",
    "pydantic>=2.10,<3.0",
    "scikit-learn>=1.6,<2.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.0,<3.0",
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.11,<1.0",
]

[project.scripts]
awair-generate = "awair.cli.generate:main"
awair-train = "awair.cli.train:main"
awair-serve = "awair.cli.serve:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/awair"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
source = ["awair"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
